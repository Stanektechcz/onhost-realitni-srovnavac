[program:reality-worker]
process_name=%(program_name)s_%(process_num)02d
command=/www/server/php/83/bin/php /www/wwwroot/reality.onhost.cz/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/www/wwwroot/reality.onhost.cz
user=www
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/www/wwwroot/reality.onhost.cz/storage/logs/worker.log
stopwaitsecs=3600
